name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 同 repo PR 才 checkout head 分支本身（供正規化後 commit 回去）；
          # push 與 fork PR 回退到預設 ref，避免 fork 分支名在本 repo 不存在而失敗。
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || github.ref }}
          persist-credentials: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Normalize ARB @@locale to match filenames
        run: dart tool/normalize_arb_locale.dart

      - name: Commit normalized ARB files (same-repo PRs only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -n "$(git status --porcelain lib/l10n)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/l10n
            git commit -m "fix(l10n): normalize ARB locale key to match filenames"
            git push origin "HEAD:$HEAD_REF"
          fi

      - run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Analyze
        run: flutter analyze

      # 圖例版面測試要載入 SDK 附的 Roboto 量實際字寬；flutter test 不會下載 material_fonts，要先 precache。
      # 快取還原的 SDK 可能留著 material_fonts.stamp 卻沒有字型檔，precache 會以為已下載而跳過，所以缺檔時先刪 stamp。
      - name: Download Material fonts
        run: |
          fonts="$FLUTTER_ROOT/bin/cache/artifacts/material_fonts"
          if ! ls "$fonts" 2>/dev/null | grep -qi '^roboto-regular\.ttf$'; then
            rm -f "$FLUTTER_ROOT/bin/cache/material_fonts.stamp"
          fi
          flutter precache --universal --no-android --no-ios --no-web --no-linux --no-windows --no-macos --no-fuchsia
          ls "$fonts" | grep -i roboto-regular

      - name: Test
        run: flutter test
